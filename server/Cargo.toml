[package]
name = "forge-server"
version = "0.20.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "forge_server"
path = "src/lib.rs"

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
i_overlay = "~4.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "net", "time", "io-util", "sync"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio-stream = "0.1"
futures-util = "0.3"
cadrum = { version = "0.9", default-features = false }
