[package]
name = "forge-desktop"
# The app's version comes from package.json, through tauri.conf.json.
version = "0.0.0"
description = "Forge desktop app: runs the Forge server and shows it in a native window"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forge-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tauri = { version = "2", features = [] }
serde_json = "1"
