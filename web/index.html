<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%238b7cf6%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Forge</span>
      <span id="project-title" class="muted"></span>
      <span class="spacer"></span>
      <span id="model-badge" class="badge"></span>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <section>
          <h2>Projects</h2>
          <ul id="projects" class="list"></ul>
          <form id="new-project" class="inline-form">
            <input id="new-project-name" placeholder="new-project-name" pattern="[a-z0-9][a-z0-9\-_]*" required />
            <button type="submit">Create</button>
          </form>
        </section>
        <section class="grow">
          <h2>Files</h2>
          <ul id="files" class="list files"></ul>
        </section>
      </aside>
      <section class="chat">
        <div id="log" class="log">
          <div class="empty">Create or pick a project, then describe what you want to build.</div>
        </div>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="e.g. Design a 60 × 40 mm enclosure with M3 standoffs" disabled></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </form>
      </section>
      <aside class="inspector">
        <section class="preview-section">
          <h2 id="preview-title">Preview</h2>
          <div id="preview" class="preview"><div class="empty">Select a file to preview it. STL files open in 3D.</div></div>
        </section>
        <section>
          <h2>Capabilities</h2>
          <div id="capabilities"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
